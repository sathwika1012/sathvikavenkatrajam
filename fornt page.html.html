<!DOCTYPE html>
<html lang="en">
<head>.
<meta charset="UTF-8">
<title>Smart Classroom Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL RESET ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(270deg, #667eea, #764ba2, #43cea2, #185a9d);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    overflow: hidden;
}

/* ===== BACKGROUND ANIMATION ===== */
@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ===== GLASS CARD ===== */
.container {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(18px);
    border-radius: 25px;
    padding: 60px 70px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: fadeIn 1.3s ease;
}

/* ===== FADE IN ===== */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ===== TITLE ===== */
.container h1 {
    color: #fff;
    font-size: 2.4rem;
    margin-bottom: 40px;
    letter-spacing: 1px;
}

/* ===== BUTTON GROUP ===== */
.buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
}

/* ===== BUTTON STYLE ===== */
.btn {
    text-decoration: none;
    padding: 20px 38px;
    font-size: 1.1rem;
    font-weight: 600;
    color: white;
    border-radius: 50px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
}

/* ===== GLOW EFFECT ===== */
.btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.35);
    transition: 0.5s;
}

.btn:hover::before {
    left: 100%;
}

/* ===== BUTTON COLORS ===== */
.cyber {
    background: linear-gradient(135deg, #ff512f, #dd2476);
    box-shadow: 0 10px 25px rgba(255, 81, 47, 0.6);
}

.data {
    background: linear-gradient(135deg, #36d1dc, #5b86e5);
    box-shadow: 0 10px 25px rgba(54, 209, 220, 0.6);
}

/* ===== HOVER EFFECT ===== */
.btn:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 18px 35px rgba(0,0,0,0.4);
}

/* ===== FOOTER TEXT ===== */
.footer {
    margin-top: 35px;
    color: rgba(255,255,255,0.8);
    font-size: 0.9rem;
}
</style>
</head>

<body>

<div class="container">
    <H6>DONE BY LE'S</H6>
    <h1>SMART ATTENDANCE</h1>

    <div class="buttons">
        <a href="cs.html" class="btn cyber">Cybersecurity</a>
        <a href="ds.html" class="btn data">Data Science</a>
    </div>

    <div class="footer">
        Choose your department to continue!
    </div>
</div>

</body>
</html>
